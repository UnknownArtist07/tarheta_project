{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ account.full_name }} — tarheta</title><link rel="stylesheet" href="{% static 'hub/hub.css' %}"></head><body><main class="hub-wrap public-state"><div class="logo"><span class="dot"></span>tarheta</div><section class="state-panel"><div class="modal-kicker">PROTECTED HUB</div><h1>This hub is password-protected.</h1><p>Enter the visitor password to view {{ account.full_name }}'s hub.</p>{% if messages %}<div class="hub-messages">{% for message in messages %}<div class="hub-message error">{{ message }}</div>{% endfor %}</div>{% endif %}<form method="post" class="gate-form">{% csrf_token %}<label>Visitor password<input type="password" name="hub_password" required autofocus></label><button class="btn btn-stamp btn-block" type="submit">Unlock hub</button></form></section></main></body></html>
